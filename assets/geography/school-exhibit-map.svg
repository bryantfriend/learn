<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="title desc">
 <title id="title">Fictional school map</title><desc id="desc">North is up. The gate is south of the bench. A straight path from gate to bench measures 4 centimetres on the source map. The school is east of the bench, along a 3 centimetre path. One map centimetre represents 10 metres.</desc>
