 <g fill="none" stroke="#d7c799" stroke-width="20"><path d="M240 360V120H420"/></g>
 <g fill="none" stroke="#137c83" stroke-width="2" stroke-dasharray="5 5"><path d="M240 360V120H420"/></g>
 <g fill="#137c83"><circle cx="240" cy="120" r="6"/><circle cx="420" cy="120" r="6"/><circle cx="240" cy="360" r="6"/></g>
