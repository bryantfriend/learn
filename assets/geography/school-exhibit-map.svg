 <g font-family="sans-serif" font-size="20" fill="#112d4d"><text x="210" y="65">Bench</text><text x="405" y="65">School</text><text x="217" y="390">Gate</text><text x="68" y="296">Garden</text><text x="272" y="250" font-weight="bold">4 cm</text><text x="305" y="100" font-weight="bold">3 cm</text></g>
