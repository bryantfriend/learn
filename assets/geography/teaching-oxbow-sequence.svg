<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="Three stages: narrowing meander neck, shorter channel, old bend isolated after its entrances disconnect"><rect width="660" height="460" rx="18" fill="#faf7ef"/><g font-family="sans-serif" fill="#112d4d"><text x="25" y="35" font-size="24">From meander to isolated oxbow lake</text><g transform="translate(0 70)"><rect x="8" y="0" width="205" height="305" rx="10" fill="#e4eddf"/><text x="20" y="30" font-size="17">1. Narrowing neck</text><path d="M30 280H55C75 280 72 245 72 190C72 80 160 80 160 190C160 245 157 280 185 280H205" stroke="#58aaba" stroke-width="14" stroke-linecap="round" fill="none"/></g><g transform="translate(215 70)"><rect x="8" y="0" width="205" height="305" rx="10" fill="#e4eddf"/><text x="20" y="30" font-size="17">2. New shorter channel</text><path d="M30 280H55C75 280 72 245 72 190C72 80 160 80 160 190C160 245 157 280 185 280H205" stroke="#58aaba" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M55 280H185" stroke="#137c83" stroke-width="12"/></g><g transform="translate(430 70)"><rect x="8" y="0" width="205" height="305" rx="10" fill="#e4eddf"/><text x="20" y="30" font-size="17">3. Old bend isolated</text><path d="M30 280H205" stroke="#58aaba" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M76 242C72 220 72 205 72 190C72 80 160 80 160 190C160 205 160 220 156 242" stroke="#58aaba" stroke-width="14" stroke-linecap="round" fill="none"/></g><text x="25" y="424" font-size="20">A shortcut alone is not isolation.</text><text x="25" y="450" font-size="18">Deposits or disconnection close the old bend’s entrances.</text></g></svg>