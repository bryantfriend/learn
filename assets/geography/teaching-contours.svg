<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="A hill shown by contours one hundred, one hundred twenty, one hundred forty and one hundred sixty metres, closer together on the east side"><rect width="660" height="460" rx="18" fill="#faf7ef"/><g font-family="sans-serif" fill="#112d4d"><text x="25" y="35" font-size="24">Contours: equal height along each line</text><ellipse cx="330" cy="230" rx="250" ry="155" fill="none" stroke="#54896d" stroke-width="3"/><text x="90" y="220" font-size="17">100 m</text><ellipse cx="365" cy="230" rx="180" ry="115" fill="none" stroke="#54896d" stroke-width="3"/><text x="195" y="220" font-size="17">120 m</text><ellipse cx="390" cy="230" rx="115" ry="75" fill="none" stroke="#54896d" stroke-width="3"/><text x="285" y="220" font-size="17">140 m</text><ellipse cx="410" cy="230" rx="55" ry="40" fill="none" stroke="#54896d" stroke-width="3"/><text x="365" y="220" font-size="17">160 m</text><text x="35" y="418" font-size="18">Contour interval: 20 m. Compare spacing on the same map.</text><text x="35" y="448" font-size="18">The closer lines on the right indicate a steeper slope.</text></g></svg>